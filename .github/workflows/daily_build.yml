name: Daily NBA Data Rebuild

on:
  schedule:
    - cron: '0 10 * * *'  # Runs at 10AM UTC (6AM EST) every day
  workflow_dispatch:        # Allows manual trigger from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn nba_api

      - name: Run build
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
        run: python Models/build_dataset.py

      - name: Commit and push fresh data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Data/players_final_scores.csv Data/players_final_scores_playoffs.csv
          git diff --staged --quiet || git commit -m "auto: daily data refresh"
          git push
